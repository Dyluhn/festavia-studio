{
  "play": {
    "name": "Play or update",
    "description": "Start the staged scene or a saved scene. Runs until stopped.",
    "fields": {
      "entry_id": {
        "name": "Studio entry ID",
        "description": "Optional when only one Studio installation is configured.",
        "selector": {
          "config_entry": {
            "integration": "festavia_studio"
          }
        }
      },
      "preset": {
        "name": "Scene",
        "selector": {
          "text": {}
        }
      },
      "colors": {
        "name": "Colors",
        "description": "Ordered hex colors, one per puck, repeated. Example: [\"#ff0000\", \"#00ff00\", \"#9900ff\"].",
        "selector": {
          "object": {}
        }
      },
      "effect": {
        "name": "Pattern",
        "selector": {
          "select": {
            "options": [
              "static",
              "flow",
              "chase",
              "bounce",
              "color_fade",
              "wave",
              "breathe",
              "heartbeat"
            ]
          }
        }
      },
      "brightness": {
        "name": "Brightness",
        "description": "Percent, within the integration brightness limit.",
        "selector": {
          "number": {
            "min": 1,
            "max": 100,
            "unit_of_measurement": "%"
          }
        }
      },
      "speed": {
        "name": "Speed",
        "selector": {
          "number": {
            "min": 0.1,
            "max": 20,
            "step": 0.1
          }
        }
      },
      "reverse": {
        "name": "Reverse direction",
        "selector": {
          "boolean": {}
        }
      }
    }
  },
