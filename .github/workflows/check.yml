name: Validate package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - run: bash tools/check.sh
  home-assistant:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["2026.10.0", "2026.10.1", "2026.11.1"]
        bridge: [BSB002, BSB003]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker run --rm -e FESTAVIA_TEST_BRIDGE_MODEL=${{ matrix.bridge }} -v "$PWD:/work:ro" --entrypoint python ghcr.io/home-assistant/home-assistant:${{ matrix.home-assistant }} /work/tests/ha_runtime.py
      - run: docker run --rm -e FESTAVIA_TEST_BRIDGE_MODEL=${{ matrix.bridge }} -v "$PWD:/work:ro" --entrypoint python ghcr.io/home-assistant/home-assistant:${{ matrix.home-assistant }} /work/tests/ha_restart.py
  usb-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-usb.txt
      - run: python tools/first-install.py --help
      - run: python tools/ha_setup.py --help
      - run: python tools/bootstrap.py --help
      - run: python -m unittest discover -s tests -p test_ha_setup.py -v
      - run: python -m unittest discover -s tests -p test_setup_package.py -v
      - run: python hue-direct/install.py --help
      - run: python hue-direct/update.py --help
      - run: python hue-direct/commission.py --help
      - run: python hue-direct/setup.py --help
      - run: python hue-direct/bootstrap.py --help
      - run: python -m unittest discover -s tests -p test_direct_package.py -v
      - run: python tools/first-install.py --port UNUSED --ssid Test --dry-run
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
  hacs:
    # The upstream validator rejects private repositories before inspecting files.
    # It becomes mandatory automatically when the repository is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false
