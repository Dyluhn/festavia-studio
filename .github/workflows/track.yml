name: Festavia Track
on:
  push:
    paths: ['track/**', '.github/workflows/track.yml']
  pull_request:
    paths: ['track/**', '.github/workflows/track.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models-and-kit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: track
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python makerworld/package.py --reference-3mf examples/Festavia-15ft-P1S.3mf --output "$RUNNER_TEMP/Festavia-MakerWorld.zip"
