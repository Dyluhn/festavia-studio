name: Prepare combined release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag matching the integration version, for example v0.13.0
        required: true
        type: string
      rebuild_direct:
        description: Build a new Direct image (requires hardware qualification before publication)
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Require matching version and successful validation of this commit
        id: version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          version = json.loads(pathlib.Path('custom_components/festavia_studio/manifest.json').read_text())['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag must match the integration manifest version')
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          result = subprocess.run(['gh', 'api', f'repos/{repo}/actions/workflows/check.yml/runs?head_sha={sha}&status=completed&per_page=10'], check=True, capture_output=True, text=True)
          runs = json.loads(result.stdout)['workflow_runs']
          if not any(r['head_sha'] == sha and r['conclusion'] == 'success' for r in runs):
              raise SystemExit('Validate package must pass on this exact commit before drafting')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\n')
          PY
      - name: Build new Direct firmware only when requested
        if: ${{ inputs.rebuild_direct }}
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            espressif/idf:v5.3.2 bash -ec '. "$IDF_PATH/export.sh"; idf.py -C hue-direct/firmware-source -B build-direct -DIDF_TARGET=esp32c6 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c6" build; python hue-direct/package.py --build build-direct --output dist/festavia-direct.zip'
      - name: Reuse source-bound firmware from the current draft or previous release
        if: ${{ !inputs.rebuild_direct }}
        run: |
          mkdir -p dist/qualified
          DIRECT_VERSION=$(python3 -c "import runpy; print(runpy.run_path('hue-direct/package.py')['VERSION'])")
          DIRECT_ASSET="festavia-direct-$DIRECT_VERSION.zip"
          if ! gh release download "$RELEASE_TAG" --pattern "$DIRECT_ASSET" --dir dist/qualified; then
            BASE_TAG=$(gh release list --limit 20 --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // empty')
            test -n "$BASE_TAG" || { echo 'No baseline image. Rerun with rebuild_direct and qualify the new image.'; exit 1; }
            gh release download "$BASE_TAG" --pattern "$DIRECT_ASSET" --dir dist/qualified
          fi
          mv "dist/qualified/$DIRECT_ASSET" dist/festavia-direct.zip
      - name: Build verified combined release artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          python3 tools/release.py --tag "$RELEASE_TAG" \
            --direct-archive dist/festavia-direct.zip --output "$RUNNER_TEMP/release"
      - name: Create or update reviewable draft
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refusing to replace a published release")' "$RUNNER_TEMP/existing-release.json"
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Festavia Studio $RELEASE_TAG — public beta" --notes-file docs/RELEASE_NOTES.md
            python3 - <<'PY'
          import json, os, pathlib, subprocess
          tag = os.environ['RELEASE_TAG']
          expected = {p.name for p in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'release').iterdir() if p.is_file()}
          existing = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'assets,isDraft']))
          if not existing['isDraft']:
              raise SystemExit('Refusing to remove assets from a published release')
          for asset in existing['assets']:
              if asset['name'] not in expected:
                  subprocess.run(['gh', 'release', 'delete-asset', tag, asset['name'], '--yes'], check=True)
          PY
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release/* --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release/* \
              --target "$GITHUB_SHA" --draft --prerelease \
              --title "Festavia Studio $RELEASE_TAG — public beta" --notes-file docs/RELEASE_NOTES.md
          fi
